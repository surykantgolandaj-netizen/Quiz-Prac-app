name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install

      - name: Initialize Capacitor Android Platform
        run: |
          npx cap add android
          npx cap sync android

      - name: Configure Native App Icon
        run: |
          # Remove default Capacitor adaptive icons that override custom icons
          rm -rf android/app/src/main/res/mipmap-anydpi-v26

          # Copy icon.png to all Android launcher icon resolutions
          ICON_PATH="www/icon.png"
          if [ ! -f "$ICON_PATH" ]; then
            ICON_PATH="icon.png"
          fi

          for dir in mipmap-mdpi mipmap-hdpi mipmap-xhdpi mipmap-xxhdpi mipmap-xxxhdpi; do
            mkdir -p "android/app/src/main/res/$dir"
            cp "$ICON_PATH" "android/app/src/main/res/$dir/ic_launcher.png"
            cp "$ICON_PATH" "android/app/src/main/res/$dir/ic_launcher_round.png"
          done
          echo "Custom icon applied successfully from $ICON_PATH"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Build Native Debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: QuizStudio-APK
          path: android/app/build/outputs/apk/**/*.apk
