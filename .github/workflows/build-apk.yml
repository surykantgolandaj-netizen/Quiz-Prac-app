name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install

      - name: Initialize Capacitor Android Platform
        run: |
          npx cap add android
          npx cap sync android

      - name: Generate Native App Icons
        run: |
          mkdir -p assets
          if [ -f "icon.png" ]; then
            cp icon.png assets/icon.png
          elif [ -f "www/icon-512.png" ]; then
            cp www/icon-512.png assets/icon.png
          elif [ -f "www/icon.png" ]; then
            cp www/icon.png assets/icon.png
          fi
          if [ -f "assets/icon.png" ]; then
            echo "Found app icon! Generating all Android launcher icon mipmaps..."
            npx @capacitor/assets generate --android
          else
            echo "No custom icon found, using default Capacitor icon."
          fi

      - name: Grant execute permission for Gradle
        run: chmod +x android/gradlew

      - name: Build Native Debug APK
        run: |
          cd android
          ./gradlew assembleDebug --no-daemon

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: QuizStudio-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
